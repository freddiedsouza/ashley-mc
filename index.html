<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ashley Dsouza | Master of Ceremonies & Voice Artist</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090a0f;
      --card: #131722;
      --card-alt: #1a202c;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text: #ffffff;
      --muted: #94a3b8;
      --border: #242c3d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.1rem 2rem;
      background: rgba(9, 10, 15, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .btn-cta {
      background: var(--accent);
      color: #000;
      padding: 0.6rem 1.4rem;
      border-radius: 99px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }

    .btn-cta:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* Hero Section with Photo 1 */
    .hero {
      position: relative;
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
      background-image: linear-gradient(rgba(9, 10, 15, 0.72), rgba(9, 10, 15, 0.88)), url('hero-bg.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 850px;
    }

    .badge {
      display: inline-block;
      padding: 0.4rem 1.1rem;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--accent);
      border-radius: 99px;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 5.5vw, 4.4rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 1.25rem;
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 650px;
      margin: 0 auto 2.25rem;
    }

    .hero-btns {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.75rem 1.6rem;
      border-radius: 99px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition: border-color 0.2s;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
    }

    /* Metrics Bar */
    .metrics {
      max-width: 1100px;
      margin: -2.5rem auto 5rem;
      padding: 0 1.5rem;
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }

    .metric-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
    }

    .metric-card strong {
      display: block;
      font-size: 2.2rem;
      color: var(--accent);
      font-weight: 800;
    }

    .metric-card span {
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* Common Section */
    section {
      max-width: 1100px;
      margin: 0 auto 6rem;
      padding: 0 1.5rem;
    }

    .sec-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .sec-header h2 {
      font-size: 2.1rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .sec-header p {
      color: var(--muted);
      font-size: 1rem;
    }

    /* Voice Reels */
    .audio-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
    }

    .audio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .audio-card {
      background: var(--card-alt);
      border: 1px solid var(--border);
      padding: 1.25rem;
      border-radius: 14px;
    }

    .audio-card h4 {
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
    }

    .audio-card span {
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 700;
    }

    audio {
      width: 100%;
      height: 38px;
    }

    /* Moments & Filter Tabs */
    .filter-tabs {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.5rem 1.2rem;
      border-radius: 99px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .gallery-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .gallery-card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .gallery-card:hover img {
      transform: scale(1.03);
    }

    .gallery-meta {
      padding: 1.25rem;
    }

    .gallery-meta h3 {
      font-size: 1.05rem;
      margin-bottom: 0.25rem;
    }

    .gallery-meta p {
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* Reviews */
    .reviews-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .review-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2rem;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stars {
      color: var(--accent);
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .review-card p {
      font-size: 0.95rem;
      color: #cbd5e1;
      font-style: italic;
      margin-bottom: 1.25rem;
    }

    .client-info strong {
      display: block;
      font-size: 0.9rem;
    }

    .client-info span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .feedback-trigger-wrap {
      text-align: center;
      margin-top: 2.5rem;
    }

    /* Booking Form */
    .booking-wrapper {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem 2rem;
      max-width: 750px;
      margin: 0 auto;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    .form-full {
      grid-column: span 2;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.85rem;
